[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remote-worker"
version = "0.1.0"
description = "Remote job execution worker agent for nautobot-app-remote-jobs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Network to Code, LLC", email = "info@networktocode.com" }]
keywords = ["nautobot", "remote-jobs", "worker", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
    "aiodocker>=0.21",
]

[project.optional-dependencies]
kafka = ["aiokafka>=0.10"]
dev = ["pytest>=8.0"]

[project.scripts]
remote-worker = "remote_worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["remote_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
