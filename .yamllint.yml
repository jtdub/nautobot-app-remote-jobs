---
extends: "default"
rules:
  comments: "enable"
  empty-values: "disable"
  indentation:
    indent-sequences: "consistent"
  line-length: "disable"
  quoted-strings:
    quote-type: "double"
ignore: |
  .venv/
  compose.yaml
  # Helm templates are Go templates, not parseable YAML.
  deploy/helm/*/templates/
