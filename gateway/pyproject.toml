[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remote-jobs-gateway"
version = "0.1.0"
description = "Stateless WebSocket gateway bridging remote-jobs workers to Nautobot via Redis pub/sub (JSON-RPC 2.0)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Network to Code, LLC", email = "opensource@networktocode.com" }]
keywords = ["nautobot", "remote-jobs", "gateway", "websocket", "json-rpc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
remote-jobs-gateway = "remote_jobs_gateway.main:run"

[tool.hatch.build.targets.wheel]
packages = ["remote_jobs_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
